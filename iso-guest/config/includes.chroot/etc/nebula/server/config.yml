pki:
  ca: /etc/nebula/server/ca.crt
  cert: /etc/nebula/server/server.crt
  key: /etc/nebula/server/server.key

lighthouse:
  am_lighthouse: true

listen:
  host: "::"
  port: 4242

punchy:
  punch: true

relay:
  am_relay: false
  use_relays: false

logging:
  level: info
  format: text

tun:
  disabled: false
  dev: nebula
  drop_local_broadcast: false
  drop_multicast: false
  tx_queue: 500
  mtu: 1420

firewall:
  outbound_action: drop
  inbound_action: drop

  conntrack:
    tcp_timeout: 12m
    udp_timeout: 3m
    default_timeout: 10m

  outbound:
    - port: any
      proto: any
      host: any

  inbound:
    - port: any
      proto: any
      host: any